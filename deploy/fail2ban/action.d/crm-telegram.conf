# Повідомлення власнику в Telegram про бан (artisan security:ban-notify).
# Від імені www-data, щоб artisan не наплодив у storage файлів, власником яких є root.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/sbin/runuser -u www-data -- /usr/bin/php8.5 /var/www/horenko/artisan security:ban-notify <ip> --failures=<failures> --bantime=<bantime> >/dev/null 2>&1 || true
actionunban =
