# Невдалі входи в CRM: рядки з storage/logs/security.log (App\Listeners\LogFailedLogin).
#   [2026-09-28 15:35:48] production.WARNING: LOGIN_FAILED ip=45.148.10.40 guard=web login="admin"
# IP стоїть до тексту, який вводить атакуючий (login), тож підсунути чужий IP не вийде.
[Definition]
failregex = ^\s*\w+\.WARNING: LOGIN_FAILED ip=<HOST> guard=
ignoreregex =
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
