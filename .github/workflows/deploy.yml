name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Дві розкатки одночасно на один сервер = зламаний vendor/. Черга замість гонки.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-afood:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to afood
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AFOOD_HOST }}
          username: afood
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/afood/a-food.com.ua/okn
            git pull origin main
            bash deploy/deploy.sh

  deploy-shinshin:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ufit
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SHINSHIN_HOST }}
          username: shinshin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/shinshin/u-fit.com.ua/crm
            git pull origin main
            bash deploy/deploy.sh

  deploy-horenko:
    runs-on: ubuntu-latest
    steps:
      # Сервер має власний /usr/local/bin/crm-deploy — див. deploy/README.md,
      # він теж має закінчуватися викликом deploy/deploy.sh.
      - name: Deploy to horenko-production (new server)
        uses: appleboy/ssh-action@master
        with:
          host: 88.99.169.99
          username: root
          key: ${{ secrets.HORENKO_SSH_KEY }}
          script: /usr/local/bin/crm-deploy
